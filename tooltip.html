<!DOCTYPE html>
<html>
<head>
  <title>Modal Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
 <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#mymodal">
    Open Modal
  </button>
<button class="btn btn-success" data-bs-toggle="tooltip" title="Click here!">
    Hover Me
  </button>
<button class="btn btn-warning" data-bs-toggle="popover" title="Info" data-bs-content="Hello User">
    Click Popover
  </button>
</div>
<div class="modal fade" id="mymodal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5>Message</h5>
      </div>
      <div class="modal-body">
        Welcome to Bootstrap!
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
var tooltip = new bootstrap.Tooltip(document.body, {
  selector: '[data-bs-toggle="tooltip"]'
});
var popover = new bootstrap.Popover(document.body, {
  selector: '[data-bs-toggle="popover"]'
});
</script>
</body>
</html>
