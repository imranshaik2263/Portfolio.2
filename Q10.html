<!DOCTYPE html>
<html>
<head>
  <title>Carousel Page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
<div id="demo" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="img1.jpg" class="d-block w-100" height="200">
      </div>
<div class="carousel-item">
        <img src="img2.jpg" class="d-block w-100" height="200">
      </div>
</div>
<button class="carousel-control-prev" data-bs-target="#demo" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
 <button class="carousel-control-next" data-bs-target="#demo" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
<button class="btn btn-primary mt-3" data-bs-toggle="collapse" data-bs-target="#info">
    Show Details
  </button>
<div id="info" class="collapse mt-2">
    <div class="card card-body">
      This is hidden content using collapse.
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
